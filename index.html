        <div class="service-request" style="margin:30px auto;padding:25px;max-width:700px;background:#f5f8fc;border-radius:18px;">
          <h2>طلب خدمة</h2>
          <p>املأ بياناتك وسيتم إرسال الطلب عبر واتساب.</p>

          <form id="serviceForm">
            <input id="name" type="text" placeholder="الاسم" required style="display:block;width:100%;margin:10px 0;padding:12px;">

            <input id="phone" type="tel" placeholder="رقم الهاتف" required style="display:block;width:100%;margin:10px 0;padding:12px;">

            <select id="service" required style="display:block;width:100%;margin:10px 0;padding:12px;">
              <option value="">اختر الخدمة</option>
              <option>صيانة أجهزة التكييف</option>
              <option>صيانة فلاتر المياه</option>
              <option>صيانة الغسالات</option>
              <option>صيانة شاشات التلفزيون</option>
              <option>صيانة التاجات</option>
            </select>

            <input id="address" type="text" placeholder="العنوان" required style="display:block;width:100%;margin:10px 0;padding:12px;">

            <textarea id="details" placeholder="تفاصيل العطل أو الطلب" rows="4" style="display:block;width:100%;margin:10px 0;padding:12px;"></textarea>

            <button type="submit" style="padding:13px 25px;cursor:pointer;">
              إرسال الطلب على واتساب
            </button>
          </form>
        </div>

        <script>
        document.getElementById("serviceForm").addEventListener("submit", function(e) {
          e.preventDefault();

          const name = document.getElementById("name").value;
          const phone = document.getElementById("phone").value;
          const service = document.getElementById("service").value;
          const address = document.getElementById("address").value;
          const details = document.getElementById("details").value;

          const message =
            "طلب خدمة - شركة الكمال تك\n" +
            "الاسم: " + name + "\n" +
            "رقم الهاتف: " + phone + "\n" +
            "الخدمة: " + service + "\n" +
            "العنوان: " + address + "\n" +
            "التفاصيل: " + (details || "لا يوجد");

          window.open(
            "https://wa.me/201283009002?text=" + encodeURIComponent(message),
            "_blank"
          );
        });
        </script>
